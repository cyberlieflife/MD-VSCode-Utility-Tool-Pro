on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

name: Release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0

    # 解析目标版本：tag push 时取 tag 名（去 v 前缀）；手动触发时取 package.json 的 version
    - name: Resolve version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          tag="${GITHUB_REF#refs/tags/}"
        else
          tag="v$(node -p "require('./package.json').version")"
        fi
        version="${tag#v}"
        pkg_version="$(node -p "require('./package.json').version")"
        if [ "$version" != "$pkg_version" ]; then
          echo "::error::Tag $tag 与 package.json 版本 $pkg_version 不一致，发布终止。"
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm test

    - name: Package VSIX
      run: npm run package

    - name: Find VSIX
      id: find_vsix
      run: |
        vsix=$(ls *.vsix 2>/dev/null | head -1)
        if [ -z "$vsix" ]; then
          echo "::error::打包后未找到 .vsix 文件"
          exit 1
        fi
        echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.tag }}
        generate_release_notes: true
        files: ${{ steps.find_vsix.outputs.vsix }}
