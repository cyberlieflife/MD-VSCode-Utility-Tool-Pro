on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

name: Release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0

    # 解析目标版本：tag push 时取 tag 名（去 v 前缀）；手动触发时取 package.json 的 version
    - name: Resolve version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          tag="${GITHUB_REF#refs/tags/}"
        else
          tag="v$(node -p "require('./package.json').version")"
        fi
        version="${tag#v}"
        pkg_version="$(node -p "require('./package.json').version")"
        if [ "$version" != "$pkg_version" ]; then
          echo "::error::Tag $tag 与 package.json 版本 $pkg_version 不一致，发布终止。"
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm test

    - name: Package VSIX
      run: npm run package

    - name: Find VSIX
      id: find_vsix
      run: |
        vsix=$(ls *.vsix 2>/dev/null | head -1)
        if [ -z "$vsix" ]; then
          echo "::error::打包后未找到 .vsix 文件"
          exit 1
        fi
        echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

    # Release notes = 仓库 CHANGELOG.md 中当前版本的小节（人工维护的详细变更）+
    # GitHub 自动生成的 commit/PR 变更列表（含 Full Changelog 对比链接）。
    # gh 不允许 --generate-notes 与自定义 notes 同时使用，因此先以自动 notes 创建 release，
    # 再把 CHANGELOG 小节拼到自动 notes 之前，最后用 --notes-file 覆盖 body。
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG="${{ steps.version.outputs.tag }}"
        VERSION="${{ steps.version.outputs.version }}"
        VSIX="${{ steps.find_vsix.outputs.vsix }}"

        # Release 已存在时跳过：工作流重跑（如 OpenVSX 步骤失败后重试）时
        # gh release create 无法重复创建，保持上游步骤可重入。
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG 已存在，跳过 GitHub Release 创建。"
          exit 0
        fi

        # 提取 CHANGELOG 中当前版本的小节；兼容 ## [vX.Y.Z]（新格式）与 vX.Y.Z 行（历史格式）。
        # 标题判定用 index() 字面子串（部分 awk 对正则 \[ 的转义处理不一致），sub(/\r$/, "")
        # 剔除 Windows 行尾，避免精确比较失败。
        section_file="$(mktemp)"
        awk -v v="$VERSION" '
          { sub(/\r$/, "") }
          index($0, "## [v") == 1 || $0 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ {
            if (in_section) exit
            if (index($0, "## [v" v "]") == 1 || $0 == "v" v) in_section = 1
            next
          }
          in_section { print }
        ' CHANGELOG.md > "$section_file"

        # 以 GitHub 自动生成的 notes 创建 release，再读取其 body 用于拼接。
        gh release create "$TAG" "$VSIX" --title "$TAG" --generate-notes
        auto_body="$(gh release view "$TAG" --json body -q .body)"

        body_file="$(mktemp)"
        if [ -s "$section_file" ]; then
          { cat "$section_file"; printf '\n---\n\n%s\n' "$auto_body"; } > "$body_file"
        else
          printf '%s\n' "$auto_body" > "$body_file"
        fi
        gh release edit "$TAG" --notes-file "$body_file"

    # 上传到 OpenVSX 市场：与 GitHub Release 共用同一个 vsix。失败时 job 标红，
    # 重跑工作流即可重试；OpenVSX 同一版本不可重复上传。
    - name: Publish to OpenVSX
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      run: |
        set -euo pipefail
        npx --yes ovsx@1.2.0 publish "${{ steps.find_vsix.outputs.vsix }}" --pat "$OVSX_PAT"
